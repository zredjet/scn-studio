[package]
name = "scn-core"
description = ".scn の解析、意味解析、IR、診断"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = { version = "3.2.0", default-features = false, features = ["std"] }
thiserror = "2.0.21"
toml = "1.1.6"
unicode-ident = "1.0.26"
yaml_serde = "0.10.7"

[dev-dependencies]
criterion = "0.8.2"
insta = { version = "1.49.0", features = ["glob"] }
proptest = "1.11.0"

[[bench]]
name = "analyze"
harness = false
