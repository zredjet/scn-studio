[package]
name = "scn-core"
description = ".scn の解析、意味解析、IR、診断"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# OS のキーチェーン（macOS のキーチェーン、Windows の資格情報マネージャー）。AI の接続のキー（T3-5）
keyring = "4.2.0"
# 書き出しのプラグインのテンプレート（T3-14）。tojson と break・continue を使えるようにする
minijinja = { version = "2.24.0", features = ["json", "loop_controls"] }
# AI の接続（T3-5）。同期の呼び出しで使い、TLS は OS のもの（native-tls）にする
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "native-tls", "http2", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = { version = "3.2.0", default-features = false, features = ["std"] }
thiserror = "2.0.21"
toml = "1.1.6"
# 環境設定で project.toml を直す（コメントと並びを残す。T4-25）
toml_edit = "0.25.15"
unicode-ident = "1.0.26"
url = "2.5.8"
yaml_serde = "0.10.7"

[dev-dependencies]
criterion = "0.8.2"
insta = { version = "1.49.0", features = ["glob"] }
proptest = "1.11.0"

[[bench]]
name = "analyze"
harness = false

# Claude Code（CLI）で呼ぶ（T4-26）：このテストの実行ファイルを模擬の CLI として起動するので、テストの枠を自前にする
[[test]]
name = "claude_code"
harness = false
