[package]
name = "scn-core"
description = ".scn の解析、意味解析、IR、診断"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# OS のキーチェーン（macOS のキーチェーン、Windows の資格情報マネージャー）。AI の接続のキー（T3-5）
keyring = "4.2.0"
# AI の接続（T3-5）。同期の呼び出しで使い、TLS は OS のもの（native-tls）にする
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "native-tls", "http2", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = { version = "3.2.0", default-features = false, features = ["std"] }
thiserror = "2.0.21"
toml = "1.1.6"
unicode-ident = "1.0.26"
url = "2.5.8"
yaml_serde = "0.10.7"

[dev-dependencies]
criterion = "0.8.2"
insta = { version = "1.49.0", features = ["glob"] }
proptest = "1.11.0"

[[bench]]
name = "analyze"
harness = false
