format_version = 0
title = {{title}}
start_scene = "s001"

# 台詞に使える括弧と、表示スタイル（FORMAT.md の .scn 形式の6節）
[dialogue.brackets]
"「」" = "normal"
"『』" = "thought"   # 心の声

# プレビューの画面の大きさ（アプリ）
[screen]
width = 1280
height = 720

# メッセージウィンドウの大きさ。台詞と地の文のはみ出し（W203）を調べ、プレビューのウィンドウにも使う
[message_window]
lines = 3
chars_per_line = 24

# エディタの入力補助（アプリ）。書いていなければ、どちらも切
[editor]
normalize_ellipsis = true   # 「...」「・・・」を「……」に、「--」を「――」にする
indent_narration = true     # 地の文の段落頭に全角空白を入れる（Enter でその行を離れるとき）

# AIの接続先（アプリとAIタスクの model が使う。FORMAT.md の作品フォルダの規約の2節）。使うときにコメントを外す。
# キーはここに書かず、アプリの環境設定で OS のキーチェーンに保存する。
# [ai.local]
# provider = "openai-compatible"
# base_url = "http://localhost:11434/v1"   # Ollama の例（LM Studio は http://127.0.0.1:1234/v1。/v1 まで書く）
# model = "[ローカルモデル名]"
# context_tokens = 8192                    # モデルの文脈の長さ（端末ごとに違えば、アプリの環境設定で上書きする）
# structured_output = true                 # 返す JSON の形を指定して頼む（対応していないサーバーなら消す）
#
# [ai.cloud]
# provider = "anthropic"
# model = "[クラウドモデル名]"
