    dir: files/chara/akari/
    expressions:
      笑顔: smile.png
      真顔: neutral.png
      照れ: {}
      泣き: {}
  tsumugi:
    dir: files/chara/tsumugi/
    expressions:
      笑顔: smile.png
      真顔: {}
      怒り: {}
  miura:
    dir: files/chara/miura/
    expressions:
      笑顔: smile.png
      真顔: neutral.png

bgm:
  日常:   { file: files/bgm/nichijo.ogg, loop: true }
  切ない: { file: files/bgm/setsunai.ogg, loop: true }

se:
