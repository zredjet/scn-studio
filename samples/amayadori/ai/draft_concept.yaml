name: 企画書の下書き
level: generate
model: cloud
context: [concept, ideas, characters, style]
output: concept
prompt: |
  アイデアメモと今の企画書、キャラクターの設定、文体の方針から、企画書の下書きを作ってください。
  ログライン、テーマ、トーン、分量（字数とルート数）、主要キャラ、エンディング（どう終わらせたいか）、本文
  （やりたいこと・やらないこと・参考にしたい感触）の案を出します。メモに書かれていないことを決めすぎず、
  メモから読み取れる方向に沿ってください。すでに書かれている項目は、より良い案があるときだけ出してください
  （人が採用を決めます）。
